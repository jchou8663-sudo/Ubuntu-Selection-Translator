[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-selection-translator"
version = "0.5.1"
description = "Ubuntu GNOME Wayland/X11 global selection translation MVP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ubuntu Selection Translator contributors"}]
dependencies = []

[project.scripts]
selection-translator = "selection_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
